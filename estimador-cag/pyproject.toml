[project]
name = "estimador-cag"
version = "0.1.0"
description = "Estimador de proyectos de software con arquitectura CAG: recibe la transcripción de una reunión y devuelve una estimación generada por un LLM (FastAPI)."
readme = "README.md"
authors = [
    { name = "Sergio Marqués López" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "openai>=3.57.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]
